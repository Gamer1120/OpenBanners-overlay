plugins {
    id 'com.android.application'
}

// Release signing key lives outside the repo: either ~/.config/openbanners-signing/keystore.properties
// (storeFile, storePassword, keyAlias, keyPassword) or, on CI, the SIGNING_* environment variables.
def signingPropsFile = new File(System.getProperty("user.home"), ".config/openbanners-signing/keystore.properties")
def signingProps = new Properties()
if (signingPropsFile.exists()) {
    signingPropsFile.withInputStream { signingProps.load(it) }
} else if (System.getenv("SIGNING_STORE_FILE")) {
    signingProps['storeFile'] = System.getenv("SIGNING_STORE_FILE")
    signingProps['storePassword'] = System.getenv("SIGNING_STORE_PASSWORD")
    signingProps['keyAlias'] = System.getenv("SIGNING_KEY_ALIAS")
    signingProps['keyPassword'] = System.getenv("SIGNING_KEY_PASSWORD")
}
def hasSigningKey = signingProps['storeFile'] != null

android {
    compileSdk 36

    defaultConfig {
        applicationId "org.openbanners.overlay"
        minSdk 26
        targetSdk 36
        versionCode 25
        versionName "${versionCode}"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            if (hasSigningKey) {
                storeFile file(signingProps['storeFile'])
                storePassword signingProps['storePassword']
                keyAlias signingProps['keyAlias']
                keyPassword signingProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            signingConfig hasSigningKey ? signingConfigs.release : null
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    namespace 'org.openbanners.overlay'
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.squareup.okhttp3:okhttp:4.10.0'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.15.2'
    implementation 'com.google.guava:guava:31.1-jre'
    implementation 'androidx.preference:preference:1.2.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}

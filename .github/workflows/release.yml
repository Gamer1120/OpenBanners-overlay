name: Release

# Push a tag like v14 to build a signed APK (sideloading) and AAB (Google Play upload) and publish them as a GitHub release.
# If the PLAY_SERVICE_ACCOUNT_JSON secret is set, the AAB is also uploaded to Google Play: track from the PLAY_TRACK
# repository variable (default "alpha" = closed testing), release status from PLAY_RELEASE_STATUS (default "completed";
# "draft" leaves it for approval in Play Console). Release notes come from fastlane/.../changelogs/<versionCode>.txt.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Restore signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          test -n "$SIGNING_KEYSTORE_BASE64" || { echo "SIGNING_KEYSTORE_BASE64 secret missing"; exit 1; }
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease bundleRelease
          cp app/build/outputs/apk/release/app-release.apk "OpenBanners-Overlay-${GITHUB_REF_NAME}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "OpenBanners-Overlay-${GITHUB_REF_NAME}.aab"

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: OpenBanners Overlay ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            OpenBanners-Overlay-${{ github.ref_name }}.apk
            OpenBanners-Overlay-${{ github.ref_name }}.aab

      - name: Prepare Google Play release notes
        id: play
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "PLAY_SERVICE_ACCOUNT_JSON not set: skipping the Google Play upload."
            echo "upload=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "upload=true" >> "$GITHUB_OUTPUT"
          version_code=$(grep -oE 'versionCode [0-9]+' app/build.gradle | grep -oE '[0-9]+')
          mkdir -p "$RUNNER_TEMP/whatsnew"
          notes="fastlane/metadata/android/en-US/changelogs/${version_code}.txt"
          if [ -f "$notes" ]; then
            head -c 500 "$notes" > "$RUNNER_TEMP/whatsnew/whatsnew-en-US"
          else
            echo "Version ${version_code}" > "$RUNNER_TEMP/whatsnew/whatsnew-en-US"
          fi
          echo "whatsnew=$RUNNER_TEMP/whatsnew" >> "$GITHUB_OUTPUT"

      - name: Upload to Google Play
        if: steps.play.outputs.upload == 'true' && startsWith(github.ref, 'refs/tags/')
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: org.openbanners.overlay
          releaseFiles: OpenBanners-Overlay-${{ github.ref_name }}.aab
          track: ${{ vars.PLAY_TRACK || 'alpha' }}
          status: ${{ vars.PLAY_RELEASE_STATUS || 'completed' }}
          whatsNewDirectory: ${{ steps.play.outputs.whatsnew }}

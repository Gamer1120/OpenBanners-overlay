name: Release

# Push a tag like v14 to build a signed APK (sideloading) and AAB (Google Play upload) and publish them as a GitHub release.
# If the PLAY_SERVICE_ACCOUNT_JSON secret is set, the AAB is then uploaded to Google Play: tag pushes go to the beta
# track (open testing) with status "completed". Production is never reached from here: the nightly "Promote to
# production" workflow (promote.yml) moves the same, already uploaded bundle to production (see docs/google-play.md).
# Running this workflow by hand on a tag (Actions → Release → Run workflow, "Use workflow from" = the tag) rebuilds
# it and uploads to another testing track or as a draft. Release notes come from fastlane/.../changelogs/<versionCode>.txt.
#
# The upload commits with changesInReviewBehavior=ERROR_IF_IN_REVIEW: if something is in review on Play (for
# example last night's production promotion) the "Google Play" job fails and nothing is cancelled. Re-run that
# failed job once the review is done, or run the workflow on the tag with cancel_review=true to cancel on purpose.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      play_track:
        description: 'Google Play testing track (production only via the Promote to production workflow)'
        type: choice
        options: [beta, alpha, internal]
        default: beta
      play_status:
        description: 'Release status ("draft" leaves it for rollout in Play Console)'
        type: choice
        options: [completed, draft]
        default: completed
      cancel_review:
        description: 'Cancel changes that are in review on Google Play (e.g. a production release) and resubmit'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'  # same major JDK as the F-Droid buildserver (reproducible builds)
          cache: gradle

      - name: Restore signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          test -n "$SIGNING_KEYSTORE_BASE64" || { echo "SIGNING_KEYSTORE_BASE64 secret missing"; exit 1; }
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease bundleRelease
          cp app/build/outputs/apk/release/app-release.apk "OpenBanners-Overlay-${GITHUB_REF_NAME}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "OpenBanners-Overlay-${GITHUB_REF_NAME}.aab"

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: OpenBanners Overlay ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            OpenBanners-Overlay-${{ github.ref_name }}.apk
            OpenBanners-Overlay-${{ github.ref_name }}.aab

  google-play:
    # Separate job so it can share the 'play-edits' concurrency group with the nightly promotion (no two
    # workflows commit a Play edit at the same moment) without holding up the build.
    needs: release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    concurrency:
      group: play-edits
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - name: Upload to Google Play
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          GH_TOKEN: ${{ github.token }}
          TRACK: ${{ inputs.play_track || 'beta' }}
          STATUS: ${{ inputs.play_status || 'completed' }}
          CANCEL_REVIEW: ${{ inputs.cancel_review && 'true' || 'false' }}
        run: |
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "PLAY_SERVICE_ACCOUNT_JSON not set: skipping the Google Play upload."
            exit 0
          fi
          # The exact AAB that was just published on the GitHub release.
          gh release download "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" -p "OpenBanners-Overlay-$GITHUB_REF_NAME.aab" -D "$RUNNER_TEMP"
          extra=""
          if [ "$CANCEL_REVIEW" = "true" ]; then extra="--cancel-review"; fi
          python3 scripts/play_upload.py --aab "$RUNNER_TEMP/OpenBanners-Overlay-$GITHUB_REF_NAME.aab" \
            --track "$TRACK" --status "$STATUS" $extra
